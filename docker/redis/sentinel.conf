# RD-7: one of three Sentinels watching the Redis primary "ocs". Two of them (quorum 2) must agree the
# primary is down before one of them promotes a replica. Copied to /data at start, because Sentinel
# rewrites its own config file (who the primary is now). TEST-ONLY passwords.
port 0
tls-port 26379
tls-cert-file /tls/redis.pem
tls-key-file /tls/redis-key.pem
tls-ca-cert-file /tls/ca.pem
tls-auth-clients no
# talk TLS to the Redis servers too
tls-replication yes

# Docker gives containers new IP addresses: work with host names, and hand host names to clients
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

sentinel monitor ocs redis 6379 2
sentinel down-after-milliseconds ocs 3000
sentinel failover-timeout ocs 20000
sentinel parallel-syncs ocs 1
# Sentinel's own Redis user (docker/redis/users.acl)
sentinel auth-user ocs sentinel
sentinel auth-pass ocs dev-only-sentinel-password

# who may ask this Sentinel: the backend (where is the primary?) and the other Sentinels
user default off
user telecom-ocs on >dev-only-sentinel-client-password allchannels +@all
user sentinel-peer on >dev-only-sentinel-peer-password allchannels +@all
sentinel sentinel-user sentinel-peer
sentinel sentinel-pass dev-only-sentinel-peer-password
