# K8-5: placeholders, no real values, and a pod with these won't get far. The prod overlay deletes them and reads
# everything from a secret store (overlays/prod/external-secrets.yaml). Never put a real value in this file.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  DB_USERNAME: REPLACE_ME
  DB_PASSWORD: REPLACE_ME
  REDIS_USERNAME: telecom-ocs
  REDIS_PASSWORD: REPLACE_ME
  CACHE_REDIS_USERNAME: telecom-cache
  CACHE_REDIS_PASSWORD: REPLACE_ME
  OTP_HASH_SECRET: REPLACE_ME
  CUSTOMER_TOKEN_SECRET: REPLACE_ME
  TLS_KEYSTORE_PASSWORD: REPLACE_ME
  TLS_TRUSTSTORE_PASSWORD: REPLACE_ME
---
# Files in /certs. Replacing them in the secret store rotates them with no restart (SE-7), and gateways.crl
# revokes a gateway within 30 s (SE-6), after Kubernetes has passed the change on to the pods (about a minute).
apiVersion: v1
kind: Secret
metadata:
  name: backend-certs
type: Opaque
stringData:
  backend.p12: REPLACE_ME
  gateway-ca-truststore.p12: REPLACE_ME
  gateways.crl: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: token-server-secrets
type: Opaque
stringData:
  TLS_KEYSTORE_PASSWORD: REPLACE_ME
  TLS_TRUSTSTORE_PASSWORD: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: token-server-certs
type: Opaque
stringData:
  token-server.p12: REPLACE_ME
  gateway-ca-truststore.p12: REPLACE_ME
  gateways.crl: REPLACE_ME
