# K8-5: settings that aren't secret. Host names are examples; the overlays give the real ones.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DB_URL: jdbc:oracle:thin:@oracle.data.example:1521/FREEPDB1
  # K8-3: DB_POOL_SIZE x maxReplicas in hpa.yaml must fit in Oracle's sessions
  DB_POOL_SIZE: "10"
  # K8-3: the same number as maxReplicas in hpa.yaml: with Redis down each copy allows limit / this
  MAX_INSTANCES: "3"
  REDIS_HOST: redis.data.example
  REDIS_PORT: "6379"
  CACHE_REDIS_HOST: redis-cache.data.example
  CACHE_REDIS_PORT: "6379"
  # what a gateway's tokens say in iss: the token server's address outside the cluster, in its certificate
  TOKEN_ISSUER: https://token.telecom.example:9443
  TOKEN_JWKS_URI: https://token-server:9443/oauth2/jwks
  STAFF_ISSUER: https://login.telecom.example/realms/telecom
  STAFF_JWKS_URI: http://keycloak.identity:8180/realms/telecom/protocol/openid-connect/certs
  OTLP_TRACING_ENDPOINT: http://jaeger-collector.monitoring:4318/v1/traces
  TRACING_SAMPLING: "0.05"
  # the ingress controller's pods change address, so a range: whose X-Forwarded-For is believed (PR-3)
  TELECOM_PUBLICRATELIMIT_TRUSTEDPROXIES_0: 10.244.0.0/16
  # the JVM takes its heap from the container's memory limit
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: token-server-config
data:
  TOKEN_ISSUER: https://token.telecom.example:9443
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70
