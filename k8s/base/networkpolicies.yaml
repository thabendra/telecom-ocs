# K8-4: the in-cluster version of the VPN firewall (VP-3). Everything is refused unless allowed below. Needs a
# network plugin that enforces these (Calico, Cilium ...): without one they are silently ignored. Most plugins let a
# node reach its own pods, so the kubelet's probes need no rule; check that on yours.
# Ranges are examples: 10.99.0.0/24 the VPN, 10.20.0.0/24 Oracle and Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # only the VPN reaches the gateway API
    - from:
        - ipBlock: { cidr: 10.99.0.0/24 }
      ports:
        - { port: 8443, protocol: TCP }
    # only the ingress controller reaches the public API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { port: 8080, protocol: TCP }
    # only monitoring reaches health and metrics
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { port: 8081, protocol: TCP }
  egress:
    # Oracle and both Redis servers
    - to:
        - ipBlock: { cidr: 10.20.0.0/24 }
      ports:
        - { port: 1521, protocol: TCP }
        - { port: 6379, protocol: TCP }
        - { port: 26379, protocol: TCP }   # Sentinel (RD-7)
    # the signing keys
    - to:
        - podSelector:
            matchLabels:
              app: token-server
      ports:
        - { port: 9443, protocol: TCP }
    # Keycloak's keys for staff logins
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: identity
      ports:
        - { port: 8180, protocol: TCP }
    # Jaeger
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { port: 4318, protocol: TCP }
    # names
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: token-server
spec:
  podSelector:
    matchLabels:
      app: token-server
  policyTypes: ["Ingress", "Egress"]
  ingress:
    # gateways through the VPN, and the backend for the keys
    - from:
        - ipBlock: { cidr: 10.99.0.0/24 }
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - { port: 9443, protocol: TCP }
  # it calls nobody; the signing keys are a mounted volume
  egress: []
