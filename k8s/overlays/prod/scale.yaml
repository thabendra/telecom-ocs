# K8-3:  DB_POOL_SIZE x maxReplicas = 10 x 6 = 60 <= 100 sessions set aside for this backend in Oracle
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  annotations:
    telecom.example/oracle-sessions-for-backend: "100"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 6
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DB_POOL_SIZE: "10"
  MAX_INSTANCES: "6"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 2
---
# keep these two load balancers inside the private network (this annotation is for AWS; each cloud has its own)
apiVersion: v1
kind: Service
metadata:
  name: backend-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
---
apiVersion: v1
kind: Service
metadata:
  name: token-server-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: external
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
