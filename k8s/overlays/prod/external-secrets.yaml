# K8-5: the real values stay in a secret store. Needs the External Secrets Operator, and a SecretStore named
# "telecom"; paths are examples. Each of these makes the Secret of the same name that the Deployments read.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: telecom
  target:
    name: backend-secrets
  dataFrom:
    - extract:
        key: telecom-ocs/backend
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-certs
spec:
  refreshInterval: 1m     # a revoked gateway (SE-6) shouldn't wait for this
  secretStoreRef:
    kind: SecretStore
    name: telecom
  target:
    name: backend-certs
  dataFrom:
    - extract:
        key: telecom-ocs/backend-certs
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: token-server-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: telecom
  target:
    name: token-server-secrets
  dataFrom:
    - extract:
        key: telecom-ocs/token-server
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: token-server-certs
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: SecretStore
    name: telecom
  target:
    name: token-server-certs
  dataFrom:
    - extract:
        key: telecom-ocs/token-server-certs
