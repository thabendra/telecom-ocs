apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  annotations:
    telecom.example/oracle-sessions-for-backend: "10"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  DB_POOL_SIZE: "10"
  MAX_INSTANCES: "1"
  DB_URL: jdbc:oracle:thin:@host.docker.internal:1521/FREEPDB1
  REDIS_HOST: host.docker.internal
  CACHE_REDIS_HOST: host.docker.internal
  CACHE_REDIS_PORT: "6380"
  TRACING_SAMPLING: "1.0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-server
spec:
  replicas: 1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: signing-keys
spec:
  accessModes: ["ReadWriteOnce"]    # one node, and that is what a local cluster offers
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 0     # one copy only: a budget of 1 would block every drain
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: token-server
spec:
  minAvailable: 0
---
apiVersion: v1
kind: Service
metadata:
  name: backend-gateway
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  loadBalancerSourceRanges: null
---
apiVersion: v1
kind: Service
metadata:
  name: token-server-gateway
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  loadBalancerSourceRanges: null
