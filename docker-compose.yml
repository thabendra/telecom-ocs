# Local Oracle Database Free 23ai + Redis. Oracle's first start takes ~1 minute; the app user "telecom" is created automatically.
# Passwords here are local test values only.
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: telecom
      APP_USER_PASSWORD: telecom
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20

  # idempotency store; data in Redis is short lived, Oracle holds balances and charges
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

volumes:
  oracle-data:
