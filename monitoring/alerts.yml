# Prometheus alert rules for telecom-ocs (loaded by monitoring/prometheus.yml). An alert tells a person to
# look; none of these blocks a subscriber.
groups:
  - name: telecom-ocs
    rules:
      # RL-3: someone became a heavy user in the last 15 minutes (bigger grants now, never a block)
      - alert: HeavyUsers
        expr: increase(ocs_heavy_users_flagged_total[15m]) > 0
        labels: { severity: info }
        annotations:
          summary: "{{ $value }} subscriber(s) became heavy users in the last 15 minutes"

      # PU-4: a gateway stopped acking commands, so a BLOCK / UNBLOCK may not have been applied
      - alert: GatewayCommandsFailed
        expr: max(ocs_push_commands{status="FAILED"}) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} gateway command(s) gave up after all deliveries"

      # CH-8: gateways forgetting to release sessions (one now and then is normal, many is a gateway bug)
      - alert: ManySessionsExpired
        expr: increase(ocs_sessions_expired_total[1h]) > 100
        labels: { severity: warning }
        annotations:
          summary: "{{ $value }} charging sessions expired in the last hour"

      # RL-4: the database bulkhead is turning requests away
      - alert: DatabaseBulkheadRejecting
        expr: rate(ocs_bulkhead_rejected_total[5m]) > 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Requests refused with 503 because no database slot was free"

      # RL-5: new sessions are being refused to keep slots for update and release
      - alert: LoadShedding
        expr: rate(ocs_load_shed_total[5m]) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "New sessions refused with 503: this backend copy is overloaded"

      # SE-6: the list isn't loading, so a gateway revoked now would not be refused
      - alert: GatewayRevocationListNotLoading
        expr: max(increase(ocs_gateway_crl_failures_total[5m])) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "The gateway revocation list can't be loaded: new revocations don't work"

      # RD-10: the data Redis uses noeviction, so when it is full writes fail: act long before that
      - alert: RedisDataMemoryHigh
        expr: max(ocs_redis_memory_used_bytes{server="data"}) / max(ocs_redis_memory_max_bytes{server="data"} > 0) > 0.8
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "The data Redis is over 80 % of its memory; at 100 % its writes fail"

      # RD-10: must never happen: it means the data Redis is not on noeviction
      - alert: RedisDataKeysEvicted
        expr: max(ocs_redis_evicted_keys{server="data"}) > 0
        labels: { severity: critical }
        annotations:
          summary: "The data Redis has evicted keys: idempotency keys or login codes may be gone"

      # RD-10: evicting is the cache's job, but this much means it is too small to help
      - alert: RedisCacheEvictingALot
        expr: max(rate(ocs_redis_evicted_keys{server="cache"}[5m])) > 10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The cache Redis keeps evicting: give it more memory"

      # CB-3: a backend copy has stopped calling Redis or a key server. It works on its fallback, so
      # nothing is down for users yet, but the thing it calls needs a look
      - alert: CircuitBreakerOpen
        expr: max by (name) (ocs_circuit_state{state="open"}) == 1
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "The {{ $labels.name }} circuit breaker has been open for 2 minutes"
