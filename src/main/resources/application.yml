spring:
  application:
    name: telecom-ocs
  # local Oracle Database Free from docker-compose.yml (test credentials only)
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:telecom}
    password: ${DB_PASSWORD:telecom}
    hikari:
      # one number for the pool and the RL-4 slots; rule: pool size x most backend copies <= Oracle sessions
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
  flyway:
    enabled: true
  # local Redis from docker-compose.yml (idempotency, rate limit buckets, login codes); Oracle stays the
  # source of truth. RD-9: TLS, trusting only the dev CA, and the backend's own ACL user (TEST-ONLY
  # password; from a secret store in production)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      username: ${REDIS_USERNAME:telecom-ocs}
      password: ${REDIS_PASSWORD:dev-only-redis-password}
      ssl:
        enabled: ${REDIS_TLS:true}
        bundle: redis-client
  # SE-1: the gateway port's certificate and the only CA it trusts (TEST-ONLY files from
  # scripts/generate-dev-certs.sh; in production these come from a secret store)
  ssl:
    bundle:
      jks:
        gateway-port:
          key:
            alias: backend
          keystore:
            location: ${TLS_DIR:file:certs}/backend.p12
            password: ${TLS_KEYSTORE_PASSWORD:changeit}
            type: PKCS12
          truststore:
            location: ${TLS_DIR:file:certs}/gateway-ca-truststore.p12
            password: ${TLS_TRUSTSTORE_PASSWORD:changeit}
            type: PKCS12
        # RD-9: Redis' certificate is from the dev CA too
        redis-client:
          truststore:
            location: ${TLS_DIR:file:certs}/gateway-ca-truststore.p12
            password: ${TLS_TRUSTSTORE_PASSWORD:changeit}
            type: PKCS12
        # SE-3: to read the token server's public keys over HTTPS (its certificate is from the dev CA)
        token-server-client:
          truststore:
            location: ${TLS_DIR:file:certs}/gateway-ca-truststore.p12
            password: ${TLS_TRUSTSTORE_PASSWORD:changeit}
            type: PKCS12

# Two doors (SE-1 + SE-8):
#   server.port         gateway API, mTLS: a client certificate from our CA is required
#   telecom.public-port customer / staff API, plain HTTP; callers log in with a JWT (group 6)
server:
  port: ${GATEWAY_PORT:8443}
  ssl:
    bundle: gateway-port
    client-auth: need          # no valid client certificate -> the TLS handshake fails

# OB-2: a third, internal door for health and metrics (Prometheus reads /actuator/prometheus).
# Plain HTTP, no login: it must only be reachable from the monitoring network, never from the
# gateways (VP-3 firewall) or the internet. Nothing of it is served on 8443 or 8080.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    ssl:
      enabled: false       # otherwise it would copy the gateway port's mTLS settings
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always   # Oracle and Redis status, for whoever can reach this internal port
  metrics:
    tags:
      application: telecom-ocs
    distribution:
      # buckets for p99 latency in Prometheus (histogram_quantile); 200 ms is the gateway's timeout per try
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms
  # OB-3: a gateway's traceparent header is continued, so one trace shows the gateway's call and
  # everything the backend did for it; spans go to Jaeger over OTLP (docker-compose.yml)
  tracing:
    enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING:1.0}   # every request locally; in production e.g. 0.05
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

telecom:
  public-port: ${PUBLIC_PORT:8080}
  gateways:
    # served only on the gateway port; refused on the public port (and the other way round)
    paths:
      - /charging/**
      - /ws/**
    # certificate names (CN) of the gateways allowed in; a valid certificate with another name gets 403
    allowed:
      - pgw-colombo-01
      - pgw-kandy-01
    # SE-3 / SE-5: every gateway call also needs an access token from the token server
    token:
      issuer: ${TOKEN_ISSUER:https://localhost:9443}
      jwk-set-uri: ${TOKEN_JWKS_URI:https://localhost:9443/oauth2/jwks}
      audience: charging-api
      scope: charging:write
      notify-scope: notify:read      # the push channel (PU-3)
  # group 4: per-gateway token bucket in Redis (RL-1, RD-3) and the database bulkhead (RL-4)
  rate-limit:
    capacity: 2000                 # burst per gateway
    refill-per-second: 1000        # steady rate per gateway
    instances: ${MAX_INSTANCES:3}  # most backend copies (autoscaler max); used only while Redis is down (RD-6)
    overrides: {}                  # e.g. pgw-kandy-01: { capacity: 500, refill-per-second: 250 }
    max-in-flight: ${DB_POOL_SIZE:10}
    in-flight-wait: 50ms
    reserved-slots: 3              # RL-5: of max-in-flight, only update and release may use these
  # group 11: circuit breakers in this backend, towards what it calls
  circuit:
    redis:                     # CB-1: many calls per second, so a percentage of the latest calls
      window-calls: 20
      minimum-calls: 10
      failure-percent: 50
      slow-call: 100ms         # Redis normally answers in a few ms
      slow-percent: 50
      open-for: 5s
      test-calls: 3
    signing-keys:              # CB-2: rare calls, so failures in a row; the last good keys stay in use
      failures-to-open: 3
      open-for: 30s
      timeout: 2s
      refresh-every: PT10M     # a key removed at the token server stops being trusted within this time
      unknown-key-gap: 30s     # tokens with made-up key ids can't flood the token server
      refresh: true
  # group 8: open charging sessions
  charging:
    session-expiry: 65m        # CH-8: no update for this long (grant validity 1 h + 5 min) -> expired
    expire-sessions: true      # run the expiry every minute in this copy (safe in several copies)
    # CH-5 / RL-3: grant sizes when the gateway leaves the size to us
    grant:
      default-mb: 100
      heavy-mb: 250              # fewer updates for users who need a lot
      heavy-threshold-mb: 2048   # 2 GB ...
      heavy-window: 15m          # ... within the last 15 minutes = a heavy user (alert, never a block)
  # group 5: commands for the gateways (outbox in gateway_command, polled at /charging/v1/commands)
  push:
    ack-timeout: 10s       # no ack within this -> delivered again
    max-backoff: 60s       # the wait doubles per delivery, up to this
    max-attempts: 4        # 1 + 3 retries (section I), then FAILED
    batch-size: 50         # most commands per poll
    pay-as-you-go-kbps: 1024
  # group 6, CU-1: customers log in with a one-time code by SMS and get a short JWT from this backend
  customers:
    otp:
      ttl: 5m              # a code works this long
      cooldown: 60s        # one new code per number per minute
      max-attempts: 5      # wrong codes before the code is deleted
      # HMAC key for the code hash kept in Redis (TEST-ONLY default; from a secret store in production)
      hash-secret: ${OTP_HASH_SECRET:dev-only-otp-hash-secret-change-me-0000}
    token:
      issuer: ${CUSTOMER_TOKEN_ISSUER:telecom-ocs-customer-login}
      audience: customer-api
      # HS256 key, at least 32 bytes, the same on every backend copy (TEST-ONLY default)
      secret: ${CUSTOMER_TOKEN_SECRET:dev-only-customer-token-secret-change-me}
      ttl: 15m
  # group 6, PR-1: provider staff log in at Keycloak (SSO); its tokens carry the roles ADMIN / CARE_AGENT
  staff:
    issuer: ${STAFF_ISSUER:http://localhost:8180/realms/telecom}
    jwk-set-uri: ${STAFF_JWKS_URI:http://localhost:8180/realms/telecom/protocol/openid-connect/certs}
    audience: telecom-ocs
  # group 6, PR-3: token buckets on the public API, the same Lua script as the gateways' (group 4)
  public-rate-limit:
    anonymous: { capacity: 30, refill-per-second: 0.5 }    # per IP: login, catalog
    customer: { capacity: 60, refill-per-second: 1 }       # per logged-in number
    staff: { capacity: 200, refill-per-second: 10 }        # per staff login
    # load balancers / proxies whose X-Forwarded-For is believed (exact addresses); empty = none
    trusted-proxies: []
  idempotency:
    # write calls that must carry an Idempotency-Key header (ID-1)
    paths:
      - /charging/v1/sessions
      - /charging/v1/sessions/*/update
      - /charging/v1/sessions/*/release
      - /api/subscribers/*/packages
      - /api/subscribers/*/top-ups
    # SOAP: every operation is POST /ws, so the operation name decides (the first element in soapenv:Body)
    soap-path: /ws/**
    soap-operations:
      - StartSessionRequest
      - UpdateSessionRequest
      - ReleaseSessionRequest
    result-ttl: 24h       # how long a finished result is kept for retries (ID-7)
    lock-ttl: 5s          # in-progress lock: ~2x the slowest normal request, so a crashed request frees the key fast (ID-5)
