spring:
  application:
    name: telecom-subscriber-service
  # local Oracle Database Free from docker-compose.yml (test credentials only)
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:telecom}
    password: ${DB_PASSWORD:telecom}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema
  flyway:
    enabled: true
  # local Redis from docker-compose.yml: idempotency store only, Oracle stays the source of truth
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  # SE-1: the gateway port's certificate and the only CA it trusts (TEST-ONLY files from
  # scripts/generate-dev-certs.sh; in production these come from a secret store)
  ssl:
    bundle:
      jks:
        gateway-port:
          key:
            alias: backend
          keystore:
            location: ${TLS_DIR:file:certs}/backend.p12
            password: ${TLS_KEYSTORE_PASSWORD:changeit}
            type: PKCS12
          truststore:
            location: ${TLS_DIR:file:certs}/gateway-ca-truststore.p12
            password: ${TLS_TRUSTSTORE_PASSWORD:changeit}
            type: PKCS12

# Two doors (SE-1 + SE-8):
#   server.port         gateway API, mTLS: a client certificate from our CA is required
#   telecom.public-port customer / admin API, plain HTTP (JWT login comes with CU / PR)
server:
  port: ${GATEWAY_PORT:8443}
  ssl:
    bundle: gateway-port
    client-auth: need          # no valid client certificate -> the TLS handshake fails

telecom:
  public-port: ${PUBLIC_PORT:8080}
  gateways:
    # served only on the gateway port; refused on the public port (and the other way round)
    paths:
      - /charging/**
      - /ws/**
    # certificate names (CN) of the gateways allowed in; a valid certificate with another name gets 403
    allowed:
      - pgw-colombo-01
      - pgw-kandy-01
  idempotency:
    # write calls that must carry an Idempotency-Key header (ID-1)
    paths:
      - /charging/v1/sessions
      - /charging/v1/sessions/*/update
      - /charging/v1/sessions/*/release
      - /api/subscribers/*/packages
      - /api/subscribers/*/top-ups
    # SOAP: every operation is POST /ws, so the operation name decides (the first element in soapenv:Body)
    soap-path: /ws/**
    soap-operations:
      - StartSessionRequest
      - UpdateSessionRequest
      - ReleaseSessionRequest
    result-ttl: 24h       # how long a finished result is kept for retries (ID-7)
    lock-ttl: 5s          # in-progress lock: ~2x the slowest normal request, so a crashed request frees the key fast (ID-5)
