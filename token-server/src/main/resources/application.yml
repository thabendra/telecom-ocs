spring:
  application:
    name: token-server
  # TEST-ONLY certificate files from scripts/generate-dev-certs.sh (run from the project root)
  # SE-7: reload-on-update: a new token-server.p12 or trust store is served without a restart
  ssl:
    bundle:
      watch:
        file:
          quiet-period: 10s      # a file being replaced is read when it has stopped changing
      jks:
        token-server:
          reload-on-update: true
          key:
            alias: token-server
          keystore:
            location: ${TLS_DIR:file:../certs}/token-server.p12
            password: ${TLS_KEYSTORE_PASSWORD:changeit}
            type: PKCS12
          truststore:
            location: ${TLS_DIR:file:../certs}/gateway-ca-truststore.p12
            password: ${TLS_TRUSTSTORE_PASSWORD:changeit}
            type: PKCS12

server:
  port: ${TOKEN_SERVER_PORT:9443}
  ssl:
    bundle: token-server
    # "want": a gateway shows its certificate to get a token (tls_client_auth), while the public
    # key set (/oauth2/jwks) and the discovery document stay readable without one
    client-auth: want

telecom:
  token:
    issuer: ${TOKEN_ISSUER:https://localhost:9443}
    audience: charging-api            # the aud claim the backend's gateway API requires (SE-3)
    access-token-ttl: 5m              # short life: a leaked token is soon useless
    # SE-7: a stored key survives a restart; a new one is published before it signs
    signing:
      directory: ${SIGNING_KEY_DIR:signing-keys}
      rotate-every: 30d
      publish-ahead: 15m              # longer than the backend's 10 minute refresh of the keys
      retire-after: 10m               # longer than access-token-ttl
      check-every: 1m
    # SE-6: scripts/revoke-gateway.sh writes this list
    revocation:
      location: ${TLS_DIR:file:../certs}/gateways.crl
      reload-every: 30s
    # one OAuth2 client per gateway; client_id = the certificate name, authenticated by that certificate;
    # enabled: false locks a gateway out whichever certificate it shows (SE-6)
    clients:
      - id: pgw-colombo-01
        subject: CN=pgw-colombo-01,O=Telecom Dev
        scopes: [charging:write, notify:read]
      - id: pgw-kandy-01
        subject: CN=pgw-kandy-01,O=Telecom Dev
        scopes: [charging:write, notify:read]
