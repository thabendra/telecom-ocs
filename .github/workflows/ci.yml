name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # test-only certificates for the mTLS gateway port (not in git)
      - run: bash scripts/generate-dev-certs.sh
      # Docker is available on GitHub runners, so the Oracle Testcontainers tests run here too
      - run: mvn -B verify
      - run: mvn -B -f gateway-simulator/pom.xml verify
      - run: mvn -B -f token-server/pom.xml verify
