name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # test-only certificates for the mTLS gateway port (not in git)
      - run: bash scripts/generate-dev-certs.sh
      # TE-4, TE-5: all three modules; fails on a skipped test or under the coverage minimum. Docker is available
      # on GitHub runners, so the Oracle Testcontainers tests run here too
      - run: bash scripts/test-all.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: target/site/jacoco/
