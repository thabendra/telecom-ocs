spring:
  main:
    web-application-type: none   # command line app
    banner-mode: off
  # SE-1: this gateway's certificate + private key, and the only CA it trusts for the backend
  # (TEST-ONLY files from scripts/generate-dev-certs.sh, run from the project root)
  ssl:
    bundle:
      jks:
        gateway:
          key:
            alias: ${GATEWAY_CERT:pgw-colombo-01}
          keystore:
            location: ${TLS_DIR:file:../certs}/${GATEWAY_CERT:pgw-colombo-01}.p12
            password: ${TLS_KEYSTORE_PASSWORD:changeit}
            type: PKCS12
          truststore:
            location: ${TLS_DIR:file:../certs}/gateway-ca-truststore.p12
            password: ${TLS_TRUSTSTORE_PASSWORD:changeit}
            type: PKCS12

simulator:
  backend-url: https://localhost:8443   # the backend's gateway port (mTLS)
  tls-bundle: gateway            # empty = plain HTTP (no client certificate)
  client-id: ${GATEWAY_CERT:pgw-colombo-01}   # = certificate name; token client_id, and sent as X-Client-Id
  token:                         # SE-2: OAuth2 client credentials; empty url = no Authorization header
    url: ${TOKEN_URL:https://localhost:9443/oauth2/token}
    scope: charging:write
  protocol: REST                 # REST (/charging/v1/sessions) or SOAP (/ws StartSession/UpdateSession/ReleaseSession)
  msisdn: "94771234567"
  app: YOUTUBE                   # YOUTUBE, WHATSAPP, FACEBOOK or GENERAL (what DPI detected)
  chunk-mb: 100                  # MB asked for in every request
  max-updates: 5                 # stop asking after this many updates (user closes the app)
  used-percent: 100              # how much of each grant the user really uses
  final-used-mb: 37              # usage reported in the release
  replay-each-request: false     # send every request twice with the same key to show idempotent replay
  retry:                         # section I
    max-retries: 3               # RT-1: 4 tries in total
    base-backoff: 100ms          # RT-2: 100, 200, 400 ms ... (each wait is random 0..backoff, RT-3)
    max-backoff: 1s
    per-try-timeout: 200ms       # RT-8: connect + read timeout of one try
    total-budget: 1500ms         # RT-8: all tries and waits must fit in this, then fail open
    failures-to-open: 5          # RT-9: failed tries in a row that open the circuit
    open-for: 10s                # RT-9: fail open at once for this long, then try one call
